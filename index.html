function render(){
  const app = document.getElementById("app");

  if(!app){
    console.log("APP introuvable");
    return;
  }

  app.innerHTML = "";

  if(!SERIES || SERIES.length === 0){
    app.innerHTML = "<p>Aucune vidéo</p>";
    return;
  }

  SERIES.forEach(series => {

    const div = document.createElement("div");
    div.className = "series";

    const title = document.createElement("h3");
    title.textContent = series.title;

    div.appendChild(title);

    series.seasons.forEach(season => {

      season.forEach(ep => {

        const btn = document.createElement("button");
        btn.className = "episode";
        btn.textContent = ep.title;

        btn.onclick = () => play(ep.url);

        div.appendChild(btn);
      });

    });

    app.appendChild(div);
  });

  console.log("Render OK");
}

// ==========================
// UTILISATEUR CONNECTÉ
// ==========================

const CURRENT_USER = USERS[0];
// change l'index selon utilisateur

// ==========================
// CONVERTIR DATE
// ==========================

function parseExpire(dateStr){

  const parts = dateStr.split("-");

  return new Date(
    parts[2],        // année
    parts[1]-1,      // mois
    parts[0],        // jour
    23,59,59
  );
}

// ==========================
// DATE EXPIRATION USER
// ==========================

const expireDate =
parseExpire(CURRENT_USER.expire);

// ==========================
// CHRONO
// ==========================

function updateChrono(){

  const now = new Date();

  const diff =
    expireDate - now;

  // =======================
  // EXPIRÉ
  // =======================

  if(diff <= 0){

    document.getElementById("chrono")
    .innerText = "EXPIRE";

    openLockPopup();

    return;
  }

  // =======================
  // CALCUL
  // =======================

  const days =
    Math.floor(diff/(1000*60*60*24));

  const hours =
    Math.floor(
      (diff%(1000*60*60*24))
      /(1000*60*60)
    );

  const minutes =
    Math.floor(
      (diff%(1000*60*60))
      /(1000*60)
    );

  const seconds =
    Math.floor(
      (diff%(1000*60))
      /1000
    );

  // =======================
  // AFFICHAGE
  // =======================

  document.getElementById("chrono")
  .innerText =

    days+"j "+
    hours+"h "+
    minutes+"m "+
    seconds+"s";
}

// ==========================
// START
// ==========================

updateChrono();

setInterval(updateChrono,1000);

function play(url){

  let finalUrl = url;

  // =========================
  // YOUTUBE
  // =========================
  if(
    url.includes("youtube.com") ||
    url.includes("youtu.be")
  ){

    let videoId = "";

    // youtu.be/xxxx
    if(url.includes("youtu.be/")){
      videoId =
        url.split("youtu.be/")[1]
        .split("?")[0];
    }

    // youtube.com/watch?v=xxxx
    else if(url.includes("v=")){
      videoId =
        url.split("v=")[1]
        .split("&")[0];
    }

    finalUrl =
      "https://www.youtube.com/embed/" +
      videoId +
      "?autoplay=1";
  }

  // =========================
  // ARCHIVE.ORG
  // =========================
  else if(url.includes("archive.org/details/")){

    let archiveId =
      url.split("/details/")[1]
      .split("?")[0];

    finalUrl =
      "https://archive.org/embed/" +
      archiveId;
  }

  // =========================
  // ARCHIVE EMBED
  // =========================
  else if(url.includes("archive.org/embed/")){

    finalUrl = url;
  }

  // =========================
  // TIKTOK
  // =========================
  else if(url.includes("tiktok.com")){

    finalUrl = url;
  }

  // =========================
  // GOOGLE SHARE
  // =========================
  else if(
    url.includes("share.google")
  ){

    finalUrl = url;
  }

  // =========================
  // PLAYER
  // =========================
  const div =
    document.createElement("div");

  div.className = "player";

  div.innerHTML = `
  
    <div style="
      position:absolute;
      top:10px;
      left:10px;
      right:10px;
      z-index:9999;
      display:flex;
      gap:10px;
    ">

      <button
        onclick="this.closest('.player').remove()"
        style="
          background:red;
          color:#fff;
          border:none;
          padding:10px 15px;
          border-radius:10px;
          cursor:pointer;
        "
      >
        ❌ Fermer
      </button>

      <button
        onclick="window.open('${url}','_blank')"
        style="
          background:#ff5a00;
          color:#fff;
          border:none;
          padding:10px 15px;
          border-radius:10px;
          cursor:pointer;
        "
      >
        🔗 Ouvrir
      </button>

    </div>

    <iframe
      src="${finalUrl}"
      allowfullscreen
      allow="
        autoplay;
        encrypted-media;
        picture-in-picture;
        web-share
      "
      referrerpolicy="no-referrer"
      style="
        width:100%;
        height:100%;
        border:none;
        background:#000;
      "
    ></iframe>

  `;

  document.body.appendChild(div);
}
