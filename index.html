</div>

<div class="marquee">

  <div class="marquee-text">
    KOMA LIVE TV - CONTACT ADMIN WHATSAPP
  </div>

  Lesfacilitateurs groupe © 2026 - Tout droit réservé

<script>
	console.log("JS OK - KOMA LIVE chargé");
const USERS = [
	
  { name: "kamo", code: "x", expire: "01-01-2030", role: "admin" },
  { name: "elect", code: "2xx", expire: "15-07-2026", role: "user" },
    { name: "lufovic", code: "2x", expire: "15-07-2026", role: "user" },


];


/* SCROLL MANUEL FIX */
const scrollBox = document.getElementById("topLinks");
let isDown = false;

scrollBox.addEventListener("mousedown", e=>{
isDown=true;
scrollBox.dataset.x=e.pageX;
scrollBox.dataset.scroll=scrollBox.scrollLeft;
});

scrollBox.addEventListener("mousemove", e=>{
if(!isDown) return;
scrollBox.scrollLeft = scrollBox.dataset.scroll - (e.pageX - scrollBox.dataset.x);
});

scrollBox.addEventListener("mouseup", ()=>isDown=false);
scrollBox.addEventListener("mouseleave", ()=>isDown=false);

/* LINKS */
const links = [
  ["Accueil", "https://lesfacilitateurs.vercel.app/"],
  ["Carte", "https://helepmoney.vercel.app/"],
  ["WhatsApp", "https://wa.me/237670035607"]
];

function loadLinks(){
let html="";
links.forEach(l=>{
html+=`<button onclick="window.open('${l[1]}')">${l[0]}</button>`;
});
document.getElementById("track").innerHTML=html;
}

/* SERIES PROPRE */
const SERIES=[
{
title:"Prison Break",
episodes:[
{title:"Episode 1",url:"https://youtu.be/gfrB94_0o2M"},
{title:"Episode 2",url:"https://youtu.be/e3Czqj9BL5M"},
{title:"Episode 3",url:"https://youtu.be/jei3GRLnaug"}
]
},
{
title:"Films",
episodes:[
{title:"Film 1",url:"https://archive.org/details/fantastic-planet__1973"},
{title:"Film 2",url:"https://youtu.be/WhCoqGZZCgs"}
]
}
];

/* RENDER */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";

  SERIES.forEach(s => {

    const div = document.createElement("div");
    div.className = "series";

    const title = document.createElement("h3");
    title.textContent = s.title;

    const box = document.createElement("div");
    box.className = "episodes";

    s.episodes.forEach(ep => {

      const card = document.createElement("div");
      card.className = "episode";
      card.textContent = ep.title;

      card.onclick = () => {
  play(ep.url);
};

      box.appendChild(card);
    });

    div.appendChild(title);
    div.appendChild(box);
    app.appendChild(div);
  });
}

/* USERS */

function openUsers(){

  let html = `
  <div class="modal">
    <div class="modal-box">
      <h2>👥 Utilisateurs</h2>

      <div class="list">
  `;

  USERS.forEach(u => {

    html += `
      <div class="item">
        <div>👤 ${u.name}</div>
        <div>📅 Expire : ${u.expire}</div>
      </div>
    `;
  });

  html += `
      </div>

      <button class="close" onclick="this.parentElement.parentElement.remove()">
        Fermer
      </button>
    </div>
  </div>
  `;

  document.body.insertAdjacentHTML("beforeend", html);
}

/* CHRONO SIMPLE */
setInterval(()=>{
let d=new Date();
document.getElementById("chrono").innerText=
d.getHours()+"h"+d.getMinutes()+"m"+d.getSeconds()+"s";
},1000);

/* INIT */
loadLinks();
render();
function play(url){

  let final = url;

  // ================= YOUTUBE =================
  if(url.includes("youtu")){
    let match = url.match(/(?:v=|youtu\.be\/)([^&]+)/);
    if(match){
      final = "https://www.youtube.com/embed/" + match[1];
    }
  }

  // ================= TIKTOK =================
  else if(url.includes("tiktok.com")){
    final = url; // fallback (iframe TikTok souvent bloqué)
  }

  // ================= ARCHIVE =================
  else if(url.includes("archive.org")){
    final = url;
  }

  // ================= PLAYER =================
  const div = document.createElement("div");
  div.className = "player";

  div.innerHTML = `
    <button onclick="this.parentElement.remove()"
      style="position:absolute;top:10px;left:10px;z-index:9999;background:red;color:#fff;padding:10px;border:none;border-radius:8px;">
      ⬅ Retour
    </button>

    <iframe src="${final}" allowfullscreen></iframe>
  `;

  document.body.appendChild(div);
}

function openVideoList(){
  let html = `
    <div class="modal">
      <div class="modal-box">
        <h2>📺 Liste des vidéos</h2>

        <div class="list">
  `;

  SERIES.forEach(s=>{
    s.episodes.forEach(ep=>{
      html += `
        <div class="item" onclick="play('${ep.url}')">
          🎬 ${ep.title}
        </div>
      `;
    });
  });

  html += `
        </div>

        <button class="close" onclick="this.parentElement.parentElement.remove()">
          Fermer
        </button>
      </div>
    </div>
  `;

  document.body.insertAdjacentHTML("beforeend", html);
}


function openVideoList(){

  let html = `
  <div class="modal">
    <div class="modal-box">

      <h2>📺 Liste Vidéos</h2>

      <div class="list">
  `;

  SERIES.forEach(series=>{

    html += `
      <div style="
        color:#ff5a00;
        font-weight:bold;
        margin-top:10px;
      ">
        ${series.title}
      </div>
    `;

    series.episodes.forEach(ep=>{

      html += `
        <div class="item video"
          onclick="play('${ep.url}')">

          🎬 ${ep.title}

        </div>
      `;
    });

  });

  html += `
      </div>

      <button class="close"
        onclick="this.parentElement.parentElement.remove()">
        Fermer
      </button>

    </div>
  </div>
  `;

  document.body.insertAdjacentHTML("beforeend", html);
}

 
 
 function openLockPopup(){

        </button>

`Bonjour KOMA LIVE TV,

Je souhaite renouveler mon abonnement.

Lien de renouvellement :
👇👇
https://helepmoney.vercel.app/?id=card1`
  );

  );
}
</script>

<button class="wa-btn" onclick="openWhatsApp()">

</button>
