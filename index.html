<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KOMA LIVE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

/* BODY SCROLL FIX */
body{
background:#050816;
color:white;
overflow:hidden;
}

body.logged{
overflow:auto;
}

/* HEADER */
header{
position:fixed;
top:0;
left:0;
right:0;
z-index:1000;
padding:15px;
background:#0f172a;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:22px;
font-weight:bold;
color:#00d0ff;
display:flex;
gap:10px;
align-items:center;
}

.logo img{
width:35px;
height:35px;
border-radius:8px;
}

#timer{
background:#111827;
padding:8px 10px;
border-radius:10px;
color:#00ffcc;
}

/* SEARCH */
#searchBar{
position:fixed;
top:60px;
left:0;
right:0;
z-index:999;
background:#0f172a;
padding:10px;
}

#searchBar input{
width:100%;
padding:12px;
border:none;
outline:none;
border-radius:12px;
background:#111827;
color:white;
}

/* CONTENT */
#content{
position:absolute;
top:120px;
bottom:70px;
left:0;
right:0;
overflow-y:auto;
padding:15px;
}

.season{
margin-bottom:40px;
}

.season h2{
margin-bottom:10px;
color:#00d0ff;
}

.episodes{
display:flex;
gap:15px;
overflow-x:auto;
}

.card{
min-width:220px;
background:#0f172a;
border-radius:15px;
overflow:hidden;
cursor:pointer;
}

.thumb{
height:130px;
background:#111;
background-size:cover;
background-position:center;
}

.info{
padding:10px;
}

/* PLAYER */
.player{
position:fixed;
inset:0;
background:rgba(0,0,0,.95);
display:none;
justify-content:center;
align-items:center;
z-index:9999;
}

.player iframe{
width:90%;
height:80%;
border:none;
border-radius:20px;
}

.close{
position:absolute;
top:20px;
right:20px;
background:red;
border:none;
padding:10px 15px;
color:white;
border-radius:10px;
cursor:pointer;
}

/* LOGIN */
#login{
position:fixed;
inset:0;
background:#050816;
display:flex;
justify-content:center;
align-items:center;
z-index:99999;
}

.box{
width:90%;
max-width:320px;
background:#0f172a;
padding:20px;
border-radius:20px;
}

.box input{
width:100%;
padding:14px;
margin-bottom:10px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
}

.box button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#0072ff;
color:white;
font-weight:bold;
}

/* FOOTER */
footer{
position:fixed;
bottom:0;
left:0;
right:0;
height:60px;
z-index:1000;
background:#0f172a;
text-align:center;
padding:10px;
border-top:1px solid rgba(255,255,255,.1);
}

/* ADMIN */
#adminPanel{
position:fixed;
inset:0;
background:#000;
z-index:99999;
display:none;
padding:20px;
overflow:auto;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

td,th{
border:1px solid #333;
padding:8px;
text-align:center;
}

button.adminBtn{
padding:5px 10px;
border:none;
border-radius:6px;
cursor:pointer;
background:#00d0ff;
color:#000;
}

.seriesBtn{
padding:8px 12px;
border:none;
border-radius:8px;
background:#00ffcc;
font-weight:bold;
cursor:pointer;
}
#content{
position:absolute;
top:120px;
bottom:70px;
left:0;
right:0;
overflow-y:auto;
overflow-x:hidden;
padding:15px;
}
.episodes{
display:flex;
gap:15px;
overflow-x:auto;
overflow-y:hidden;
flex-wrap:nowrap;
scroll-behavior:smooth;
-webkit-overflow-scrolling:touch;
}

.card{
flex:0 0 auto;
min-width:220px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
<div class="box">
<h2>ACCÈS</h2>
<input id="phone" placeholder="Téléphone">
<input id="code" placeholder="Code">
<button onclick="login()">ENTRER</button>
</div>
</div>

<!-- HEADER -->
<header>
<div class="logo">
<img src="https://raw.githubusercontent.com/Lfg237/image-lovestring/main/file_00000000941c71f4a5497e043e48dd5b.png">
KOMA LIVE
</div>

<div id="timer">00:00:00</div>

<div style="display:flex;gap:10px;">
<button class="seriesBtn" onclick="toggleVideoList()">📺 Vidéos</button>
<button class="seriesBtn" onclick="openAdmin()">ADMIN</button>
</div>
</header>

<!-- SEARCH -->
<div id="searchBar">
<input id="search" placeholder="Rechercher..." onkeyup="searchVideos()">
</div>

<!-- CONTENT -->
<div id="content"></div>

<!-- PLAYER -->
<div class="player" id="player">
<button class="close" onclick="closeVideo()">FERMER</button>
<iframe id="frame"></iframe>
</div>

<!-- ADMIN -->
<div id="adminPanel">
<h2 style="color:#00d0ff;">TABLEAU ADMIN</h2>
<button onclick="closeAdmin()">FERMER</button>

<table>
<thead>
<tr>
<th>Numéro</th>
<th>Code</th>
<th>Temps</th>
<th>Statut</th>
<th>Action</th>
</tr>
</thead>
<tbody id="adminTable"></tbody>
</table>
</div>

<!-- VIDEO LIST -->
<div id="videoMenu" style="
position:fixed;
inset:0;
background:rgba(0,0,0,.95);
display:none;
z-index:10000;
overflow:auto;
padding:20px;
">

<h2 style="color:#00d0ff;">📺 Liste vidéos</h2>
<div id="videoList"></div>

</div>

function renderSeries(){

const content=document.getElementById("content");
content.innerHTML="";

SERIES.forEach((serie,serieIndex)=>{

serie.seasons.forEach((season,sIndex)=>{

let div=document.createElement("div");
div.className="season";

div.innerHTML=`
<h2>${serie.title} - Saison ${sIndex+1}</h2>
<div class="episodes"></div>
`;

content.appendChild(div);

let container=div.querySelector(".episodes");

season.forEach((video,eIndex)=>{

let card=document.createElement("div");
card.className="card";

card.innerHTML=`
<div class="thumb"></div>
<div class="info">
<h3>${serie.title}</h3>
<p>Episode ${eIndex+1}</p>
</div>
`;

card.onclick=()=>openVideo(video);

container.appendChild(card);

});

});

});

}
/* TIMER */
let timerInterval;

function startTimer(){

let saved = localStorage.getItem("koma_time_" + currentUser.phone);

let time;

if(saved){
  time = parseInt(saved);
} else {
  time = currentUser.time * 60;
}

clearInterval(timerInterval);

timerInterval = setInterval(()=>{

if(time <= 0){

clearInterval(timerInterval);
alert("Temps terminé - compte expiré");

currentUser.active = false;

localStorage.removeItem("koma_time_" + currentUser.phone);

document.getElementById("login").style.display = "flex";
document.body.classList.remove("logged");

return;
}

time--;

// 💾 SAUVEGARDE chaque seconde
localStorage.setItem("koma_time_" + currentUser.phone, time);

let h = Math.floor(time/3600);
let m = Math.floor((time%3600)/60);
let s = time%60;

document.getElementById("timer").innerText =
`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

},1000);

}


/* VIDEO */
function openVideo(url){
  document.getElementById("player").style.display = "flex";

  // CAS PLAYLIST
  if(url.includes("playlist")){
    window.open(url, "_blank");
    return;
  }

  let videoId = "";

  // lien youtu.be
  if(url.includes("youtu.be/")){
    videoId = url.split("youtu.be/")[1].split("?")[0];
  }

  // lien watch
  else if(url.includes("watch?v=")){
    videoId = url.split("watch?v=")[1].split("&")[0];
  }

  document.getElementById("frame").src =
    "https://www.youtube.com/embed/" + videoId;
}

function closeVideo(){
document.getElementById("player").style.display="none";
document.getElementById("frame").src="";
}

/* SEARCH */
function searchVideos(){
let v=document.getElementById("search").value.toLowerCase();
document.querySelectorAll(".card").forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(v)?"block":"none";
});
}

document.getElementById("adminPanel").style.display="block";

}

function closeAdmin(){

}

function renderAdmin(){
let t=document.getElementById("adminTable");
t.innerHTML="";

USERS.forEach((u,i)=>{
t.innerHTML+=`

/* VIDEO LIST */
function toggleVideoList(){
const menu=document.getElementById("videoMenu");
menu.style.display=menu.style.display==="block"?"none":"block";
buildVideoList();
}

function buildVideoList(){

const list=document.getElementById("videoList");
list.innerHTML="";

SERIES.forEach((serie,serieIndex)=>{

serie.seasons.forEach((season,sIndex)=>{

season.forEach((video,eIndex)=>{

let div=document.createElement("div");

div.style.cssText=`
padding:12px;
background:#0f172a;
margin-bottom:10px;
border-radius:10px;
cursor:pointer;
color:white;
font-weight:bold;
`;

div.innerText=`🎬 ${serie.title} | S${sIndex+1} EP${eIndex+1}`;

div.onclick=()=>{
document.getElementById("videoMenu").style.display="none";
openVideo(video);
};

list.appendChild(div);

});

});

});

}
function login(){
  const phone = document.getElementById("phone").value;
  const code = document.getElementById("code").value;

  const user = USERS.find(u => u.phone === phone && u.code === code);

  if(!user){
    alert("Identifiants incorrects");
    return;
  }

  currentUser = user;

  document.getElementById("login").style.display = "none";
  document.body.classList.add("logged");

  renderSeries();
  startTimer();
}
