<meta charset="UTF-8">

<title>KOMA LIVE</title>

<style>
body{
margin:0;font-family:Arial;color:#fff;
background:radial-gradient(circle,#1a0000,#000);
overflow:hidden;
}

body::before{
content:"";position:fixed;inset:0;
background:
radial-gradient(circle at 20% 20%,rgba(255,80,0,.3),transparent),
radial-gradient(circle at 80% 30%,rgba(255,0,0,.2),transparent),
radial-gradient(circle at 50% 80%,rgba(255,120,0,.15),transparent);
filter:blur(60px);
animation:move 8s infinite alternate;
z-index:-1;
}

@keyframes move{to{transform:translateY(20px) scale(1.1)}}

header{
position:fixed;top:0;left:0;right:0;height:55px;
background:#0a0a0a;display:flex;
justify-content:space-between;align-items:center;
padding:0 10px;z-index:10;
}

#topBar{
position:fixed;top:55px;left:0;right:0;
display:flex;gap:6px;overflow:auto;
padding:6px;background:#0b0b0b;
}

#topBar button{
background:#ff5a00;border:none;color:#fff;
padding:6px 10px;border-radius:10px;
}

#searchBar{
position:fixed;top:100px;left:0;right:0;
padding:8px;background:#0a0a0a;
}

#searchBar input{
width:100%;padding:10px;border:none;
border-radius:10px;background:#111;color:#fff;
}

#content{
position:absolute;top:160px;bottom:0;left:0;right:0;
overflow:auto;padding:10px;
}

.season{margin-bottom:20px}
.season h2{color:#ff6a00}
.episodes{display:flex;gap:10px;overflow:auto}

.card{
min-width:180px;background:#111;
padding:10px;border-radius:10px;
cursor:pointer;transition:.2s;
}
.card:hover{transform:scale(1.05)}

.player{
position:fixed;inset:0;
background:rgba(0,0,0,.95);
display:none;justify-content:center;
align-items:center;z-index:99;
}
.player iframe{width:90%;height:80%;border:none}

/* POPUP */
.popup{
position:fixed;inset:0;
display:flex;justify-content:center;
align-items:center;
background:rgba(0,0,0,.6);
backdrop-filter:blur(10px);
z-index:999;
}

.box{
width:90%;max-width:340px;
padding:20px;border-radius:16px;
background:linear-gradient(135deg,#111,#1b1b1b);
text-align:center;
}

.box h2{color:#ff5a00}

.box input{
width:100%;padding:10px;margin-top:8px;
border:none;border-radius:8px;
background:#222;color:#fff;
}

.btn{
width:100%;padding:10px;margin-top:10px;
border:none;border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.loginBtn{background:#ff5a00;color:#fff}
.adminBtn{background:#444;color:#fff}
.waBtn{background:#25D366;color:#fff}

.footer{
position:fixed;
bottom:0;
left:0;
right:0;
height:40px;
background:#0a0a0a;
display:flex;
justify-content:center;
align-items:center;
color:#ff6a00;
font-size:12px;
}
</style>

/* ===== LOGIN ===== */
function login(){
const n=$("name").value.trim();
const c=$("code").value.trim();

const u=USERS.find(x=>x.name===n && x.code===c && x.active);

if(!u){
alert("❌ Erreur login");
return;
}

saveSession(u);
afterLogin(u);
}

/* ===== SESSION ===== */
function saveSession(u){
const expiry = Date.now()+DURATION_MINUTES*60*1000;

localStorage.setItem(SESSION_KEY,JSON.stringify({
name:u.name,
code:u.code,
expiry
}));
}

/* ===== AFTER LOGIN ===== */
function afterLogin(u){
currentUser=u;
$("login").style.display="none";
render();
startTimer(Date.now()+DURATION_MINUTES*60*1000);
}

/* ===== AUTO LOGIN ===== */
/* ===== BUTTON FIX ===== */

/* ===== BUTTON FIX ===== */
window.onload = function(){

document.getElementById("mainLoginBtn").onclick = function(){

if(adminMode){
checkAdmin();
}else{
login();
}

};

};
/* ===== TIMER ===== */
function startTimer(expiry){
clearInterval(timerInterval);

timerInterval=setInterval(()=>{
let t=Math.floor((expiry-Date.now())/1000);

if(t<=0){
clearInterval(timerInterval);
showBlocked();
return;
}

$("timer").textContent=
String(Math.floor(t/60)).padStart(2,'0')+":"+
String(t%60).padStart(2,'0');

},1000);
}

/* ===== BLOCK ===== */
function showBlocked(){
document.body.insertAdjacentHTML("beforeend",`
<div class="popup">
<div class="box">
<h2>🔒 ACCÈS BLOQUÉ</h2>
<button class="btn waBtn" onclick="openWhatsApp()">WhatsApp</button>
</div>
</div>
`);
}

/* ===== ADMIN OPEN (FIX PRINCIPAL) ===== */
function admin(){

let code = prompt("Entrer le code admin");

if(code === ADMIN){

openAdminPanel();

}else{

alert("❌ Code admin incorrect");

}

}

/* ===== CHECK ADMIN ===== */
function checkAdmin(){
const c=$("code").value.trim();

if(c!==ADMIN){
alert("❌ Code admin incorrect");
return;
}

$("login").style.display="none";
openAdminPanel();
}

$("name").value = "";
$("code").value = "";

}

/* ===== ADMIN PANEL ===== */
function openAdminPanel(){

document.getElementById("adminBox")?.remove();

document.body.insertAdjacentHTML("beforeend",`
<div class="popup" id="adminBox">
<div class="box">

<h2>🔐 ADMIN PANEL</h2>

${USERS.map((u,i)=>`
<div style="margin:6px;background:#222;padding:8px;border-radius:8px">
${u.name} - ${u.active?"ACTIF":"BLOQUÉ"}

<button onclick="toggleUser(${i})"
style="float:right;background:${u.active?'red':'green'};border:none;color:#fff;padding:5px;border-radius:6px">
Action
</button>
</div>
`).join("")}

<button class="btn loginBtn" onclick="closeAdmin()">FERMER</button>

</div>
</div>
`);
}

function closeAdmin(){
document.getElementById("adminBox")?.remove();
resetLogin();
}

function toggleUser(i){
USERS[i].active=!USERS[i].active;
openAdminPanel();
}

/* ===== RENDER EPISODES ===== */
function render(){
$("content").innerHTML="";

SERIES.forEach(s=>{
s.seasons.forEach((se,i)=>{

let d=document.createElement("div");
d.className="season";
d.innerHTML=`<h2>${s.title} S${i+1}</h2><div class="episodes"></div>`;

let box=d.querySelector(".episodes");

se.forEach((v,index)=>{
let c=document.createElement("div");
c.className="card";
c.innerText="Episode "+(index+1);
c.onclick=()=>play(v);
box.appendChild(c);
});

$("content").appendChild(d);

});
});
}

/* ===== VIDEO PLAYER ===== */
function play(u){
$("player").style.display="flex";
$("frame").src=u;
}

function closePlayer(){
$("player").style.display="none";
$("frame").src="";
}

/* ===== SEARCH ===== */
function searchVideos(){
let v=$("search").value.toLowerCase();

document.querySelectorAll(".card").forEach(c=>{
c.style.display=c.innerText.toLowerCase().includes(v)?"block":"none";
});
}

/* ===== WHATSAPP ===== */
function openWhatsApp(){
let msg=`Nom:${$("name").value}\nCode:${$("code").value}`;

window.open("https://wa.me/237670035609?text="+encodeURIComponent(msg));
}

/* ===== VIDEO LIST ===== */
function openVideoList(){
let html=`<div class="popup"><div class="box"><h2>📺 LISTE</h2>`;

SERIES.forEach(s=>{
s.seasons.forEach((se,i)=>{
html+=`<h3>${s.title} S${i+1}</h3>`;

se.forEach((v,i2)=>{
html+=`<div onclick="play('${v}')" style="padding:5px;background:#222;margin:5px;border-radius:6px">
Episode ${i2+1}</div>`;
});
});
});

html+=`<button class="btn loginBtn" onclick="this.closest('.popup').remove()">FERMER</button></div></div>`;

document.body.insertAdjacentHTML("beforeend",html);
}
</script>

</body>
</html>
